# Configuración base compartida para el proyecto Compressed LLM.
# Valores iniciales según §43 de la especificación. Editables libremente.
name: base
seed: 42

model:
  vocab_size: 32000
  hidden_size: 256
  num_layers: 4
  num_heads: 4
  intermediate_size: 1024
  max_position_embeddings: 4096
  dropout: 0.1
  pad_token_id: 0
  bos_token_id: 1
  eos_token_id: 2

compressor:
  encoder_layers: 2
  hidden_size: 256
  num_heads: 4
  latent_count: 32
  latent_dim: 256
  cross_attention_layers: 2
  local_window: 64
  dropout: 0.1

training:
  max_input_tokens: 256
  max_output_tokens: 256
  batch_size: 2
  gradient_accumulation: 16
  learning_rate: 3e-4
  warmup_steps: 100
  max_steps: 10000
  mixed_precision: fp16
  weight_decay: 0.0
  log_steps: 10
  save_steps: 1000
  eval_steps: 500
  output_dir: results
  grad_clip: 1.0

loss:
  preference_weight: 0.1
  information_weight: 0.0