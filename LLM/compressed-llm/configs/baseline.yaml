# Baseline SIN compresión (§17) - controls obligatorios.
# El decoder procesa el contexto tokenizado directamente.
# La sección 'compressor' se ignora: CompressedLLM(use_compression=False).
name: baseline

model:
  hidden_size: 256
  num_layers: 4
  num_heads: 4
  intermediate_size: 1024
  max_position_embeddings: 1024

compressor:
  encoder_layers: 2
  hidden_size: 256
  num_heads: 4
  latent_count: 256  # igual a N; no usado en baseline directo
  latent_dim: 256
  cross_attention_layers: 2
  local_window: 64

training:
  max_input_tokens: 256
  max_output_tokens: 256
  batch_size: 2
  gradient_accumulation: 16
  learning_rate: 3e-4
  warmup_steps: 100
  max_steps: 10000
  mixed_precision: fp16

loss:
  preference_weight: 0.1
  information_weight: 0.0